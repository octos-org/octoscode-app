# A33: the macOS menu-bar name and bundle id of a native launch from this
# workspace (`cargo run -p octoscode-desktop`). makepad's platform/build.rs
# writes them into the Info.plist beside the binary; without them it names the
# app after the checkout directory. The packaged OctosCode.app carries its own
# Info.plist (tools/package-macos.sh) with the same two values.
[env]
MAKEPAD_BUNDLE_NAME = { value = "OctosCode", force = true }
MAKEPAD_BUNDLE_IDENTIFIER = { value = "org.octos.octoscode", force = true }

# Product icons for plain cargo launches and packaged builds.
MAKEPAD_APP_ICON_32 = { value = "crates/octoscode-desktop/resources/icon_32.png", relative = true }
MAKEPAD_APP_ICON_64 = { value = "crates/octoscode-desktop/resources/icon_64.png", relative = true }
MAKEPAD_APP_ICON_128 = { value = "crates/octoscode-desktop/resources/icon_128.png", relative = true }
MAKEPAD_APP_ICON_256 = { value = "crates/octoscode-desktop/resources/icon_256.png", relative = true }
MAKEPAD_APP_ICON_512 = { value = "crates/octoscode-desktop/resources/icon_512.png", relative = true }
MAKEPAD_APP_ICON_1024 = { value = "crates/octoscode-desktop/resources/icon_1024.png", relative = true }
MAKEPAD_APP_ICON_ICO = { value = "crates/octoscode-desktop/resources/icon.ico", relative = true }
