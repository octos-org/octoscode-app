[package]
name = "octoscode-module"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The octoscode AppModule: renders connection state + session count from the store, and the L0 binding table"

[dependencies]
# The Makepad AppModule surface (re-homed from the D9 shape-(i) spike).
makepad-widgets = { workspace = true }
makepad-app-module = { workspace = true }
# Our crates.
octoscode-client = { workspace = true }
octoscode-store = { workspace = true }
octos-core = { workspace = true }
octos-app-transport = { workspace = true }
# #32h: the solo-profile discovery POST (api/auth/solo) before the WS upgrade.
reqwest = { workspace = true }
# The L0 card runtime (card #15b) — the same renderer the Gate-B renders used.
octoscript-makepad = { workspace = true }
octoscript-widgets = { workspace = true }
octoscript-ui-l0 = { workspace = true }
# #32h item 1: register the NAV global the lowered cards' on_click handlers
# call (add_global_fn / string_prop live here; the fork's octoscript-makepad
# depends on this same path, so cargo unifies the copy).
octoscript-render = { path = "../../.forks/octoscript-makepad-fork/crates/octoscript-render" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
log = { workspace = true }
url = "2"
# #A2 board 1: p4-05's "Paired  Today, 9:41 PM" in the device's own zone.
chrono = "0.4"
# A28: the diff review's word pattern (`[\p{L}\p{N}\p{M}_$]+`, diff-presentation.ts:125)
# needs Unicode general categories; already in both lockfiles (1.13.1).
regex = "1"
# A21: the tab drafts' identity is a digest of (origin, token) — the file
# never holds the token itself (already in Cargo.lock via the transport).
sha2 = "0.10"

[dev-dependencies]
# The fake WS server (card #12 §1 fake test, §5 headless proof). Same
# tokio-tungstenite major the transport uses.
tokio-tungstenite = "0.24"
futures-util = "0.3"
# The replay test (card #13 §5) builds a store directly.
octoscode-store = { workspace = true }
