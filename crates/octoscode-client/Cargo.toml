[package]
name = "octoscode-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed UI-Protocol client for octoscode-app: one Method per RPC, a domain registry, and unknown-method tolerance"

[dependencies]
octos-core = { workspace = true }
octos-app-transport = { workspace = true }
octoscode-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
url = "2"
