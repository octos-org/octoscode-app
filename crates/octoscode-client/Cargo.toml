[package]
name = "octoscode-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed UI-Protocol client for octoscode-app: one Method per RPC, a domain registry, and unknown-method tolerance"

[dependencies]
octos-core = { workspace = true }
octos-app-transport = { workspace = true }
octoscode-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
# #A2 board 1: the pairing claim is one unauthenticated HTTP POST to the
# server origin (web pairing.ts:185-205), made before the socket exists.
reqwest = { workspace = true }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
url = "2"
