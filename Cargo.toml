# octoscode-app — the native Makepad/Octoscript client for octos, at parity
# with the TypeScript web client. Phase 1: the core (client + store + module).
#
# The standalone desktop app uses the local WebSocket transport and UI crates.
# OctoSense's shell, kernel and configuration library are not dependencies.
# The optional octosense-module feature exposes an adapter for embedded hosts.
[workspace]
resolver = "2"
members = [
    "crates/octoscode-transport",
    "crates/octoscode-client",
    "crates/octoscode-store",
    "crates/octoscode-module",
    "crates/octoscode-desktop",
]
# Local forks (tools/prepare-*-fork.sh) live in .forks/; they are their own workspaces.
exclude = [".forks"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Protocol types (RpcError, Capabilities, the method-name constants, the
# `*Params`/`*Result` shapes). The octos revision is OctoSense's own pin.
octos-core = { git = "https://github.com/octos-org/octos.git", rev = "b0759a57719fd35b3a2da1c5d969bc67538ed516" }
# The extracted WebSocket client has no OctoSense kernel dependency.
octos-app-transport = { package = "octoscode-transport", path = "crates/octoscode-transport" }
# Our crates.
octoscode-client = { path = "crates/octoscode-client" }
# #32h: the solo-profile discovery POST (api/auth/solo) — same spec the
# octos-app-transport checkout pins (its workspace :123), so one copy builds.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
octoscode-store = { path = "crates/octoscode-store" }
octoscode-module = { path = "crates/octoscode-module" }
# The L0 card runtime (card #15b): the SAME renderer card-host used for the
# Gate-B renders (`card-host/src/host.rs:144-154` calls
# `octoscript_makepad::l0::prepare` then `design::to_makepad_ui`).
# `octoscript-widgets` registers the DSL's widget names (DesignSurface,
# DesignNativeButton, …); `octoscript-ui-l0` realizes + lowers the card.
# Octoscript-Makepad main, with the measured-design lowering this app's
# components are authored against (flows, fill/fit, markdown, right anchors,
# in-slot: Octoscript-Makepad #77), and the Octoscript its runtime.json pins.
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "33dea2f1f3ad3f1346a219aa8cf6e91b31361e23" }
octoscript-widgets = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "33dea2f1f3ad3f1346a219aa8cf6e91b31361e23" }
octoscript-render = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "33dea2f1f3ad3f1346a219aa8cf6e91b31361e23" }
octoscript-ui-l0 = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "2e37d9e657a246f16718d9a475e167ccd2d5b5fa" }

# Makepad renderer and optional AppModule adapter, pinned to compatible revisions.
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "32d6415fb7476345ad36ee4f98d6f844d1f07fd2" }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "32d6415fb7476345ad36ee4f98d6f844d1f07fd2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
log = "0.4"

# Octoscript-Makepad at the `rev` above, unpatched: the plain checkout
# `tools/prepare-octoscript-makepad.sh` makes. makepad-widgets takes
# `octoscript-node` from Octoscript-Makepad too (an older rev); redirecting
# every Octoscript-Makepad crate to this one checkout keeps ONE octoscript-node,
# as makepad's own workspace and OctoSense's `.sources` do.
[patch."https://github.com/OctoSense-org/Octoscript-Makepad.git"]
octoscript-makepad = { path = ".forks/octoscript-makepad/crates/octoscript-makepad" }
octoscript-widgets = { path = ".forks/octoscript-makepad/crates/octoscript-widgets" }
octoscript-node = { path = ".forks/octoscript-makepad/crates/octoscript-node" }
octoscript-render = { path = ".forks/octoscript-makepad/crates/octoscript-render" }

# A33 (decision D10f): makepad WITH our patches/makepad/*.patch — the same
# patches every OctoSense tree gets (the notification API, so
# cfg(makepad_notifications) is on here too; the --remote token guard; the
# ellipsis fix; file_resource in a packaged build). The pinned rev
# (32d6415f, makepad main, the `rev` above) + those patches, one commit:
# `tools/prepare-makepad-fork.sh` recreates the fork. Every crate this graph
# names by this URL is redirected, so the graph keeps ONE makepad.
[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-widgets = { path = ".forks/makepad-fork/widgets" }
makepad-app-module = { path = ".forks/makepad-fork/libs/app_module" }
makepad-script = { path = ".forks/makepad-fork/platform/script" }

# A35b: the dev profile (a plain `cargo build -p octoscode-desktop`, target/debug/octoscode;
# every test) optimizes every DEPENDENCY. The UI thread's time is spent in them — makepad's
# widget-tree lookups, script VM, layout and draw — and at opt-level 0 the folder browser's open
# and navigations took 0.3-0.7 s against well under 0.1 s optimized
# (tools/walk/a35_browser_latency_walk.py). The workspace's own crates keep opt-level 0 and
# incremental builds, so the edit-build loop stays fast; tools/build-macos.sh builds release.
[profile.dev.package."*"]
opt-level = 3
debug = false

# A33: the self-contained OctosCode.app (tools/package-macos.sh): release settings in a
# profile of its own (target/app-bundle/), because that build carries makepad's bundle-only
# cfg (MAKEPAD=apple_bundle, MAKEPAD_PACKAGE_DIR) and must never overwrite a plain release
# build, nor be overwritten by one.
[profile.app-bundle]
inherits = "release"
